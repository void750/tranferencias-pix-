<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento PIX</title>
<style>
body{
    background:#080808;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:30px 15px;
}
h1{
    color:#00ff66;
}
.valores{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    max-width:600px;
    margin:auto;
}
button{
    background:#00b84f;
    color:white;
    border:0;
    border-radius:10px;
    padding:15px 22px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}
button:hover{
    background:#00ff66;
    color:#000;
}
#resultado{
    margin-top:30px;
}
#qr{
    width:250px;
    background:white;
    padding:10px;
    border-radius:10px;
}
textarea{
    display:block;
    width:90%;
    max-width:550px;
    height:100px;
    margin:20px auto 10px;
    background:#111;
    color:#00ff66;
    border:1px solid #00ff66;
    border-radius:8px;
    padding:10px;
}
#copiar{
    margin-top:10px;
}
</style>
</head>
<body>
<h1>💰 PAGAMENTO PIX</h1>
<p>Escolha o valor:</p>
<div class="valores">

R$ 250

R$ 300

R$ 500

R$ 600

R$ 700

R$ 800

R$ 900

R$ 1.000

R$ 1.500

R$ 2.000

R$ 3.000

</div>
<div id="resultado"></div>
<script>
const CHAVE =
"8217f3e7-bb4b-4fb4-adcd-c4df2d196de6";
function campo(id,valor){
return id +
String(valor.length).padStart(2,"0") +
valor;
}
function crc16(texto){
let crc=0xFFFF;
for(let i=0;i<texto.length;i++){
crc ^= texto.charCodeAt(i)<<8;
for(let j=0;j<8;j++){
if(crc&0x8000){
crc=((crc<<1)^0x1021)&0xFFFF;
}else{
crc=(crc<<1)&0xFFFF;
}
}
}
return crc.toString(16)
.toUpperCase()
.padStart(4,"0");
}
function pix(valor){
let conta=
campo("00","br.gov.bcb.pix")+
campo("01",CHAVE);
let codigo=
campo("00","01")+
campo("26",conta)+
campo("52","0000")+
campo("53","986")+
campo("54",valor.toFixed(2))+
campo("58","BR")+
campo("59","CASH FARMEM")+
campo("60","SAO PAULO")+
campo("62",campo("05","***"));
codigo+="6304";
codigo+=crc16(codigo);
document.getElementById("resultado").innerHTML=
"<h2>R$ "+
valor.toLocaleString("pt-BR",{minimumFractionDigits:2})+
"</h2>"+
"<img id='qr' src='https://api.qrserver.com/v1/create-qr-code/?size=500x500&data="+
encodeURIComponent(codigo)+
"'>"+
"<textarea id='codigo' readonly>"+
codigo+
"</textarea>"+

“”+
“📋 COPIAR PIX”+
“”;

}

function copiar(){

let campo=document.getElementById(“codigo”);

campo.select();

navigator.clipboard.writeText(campo.value);

alert(“✅ Pix copiado!”);

}

</script>
</body>
</html>
