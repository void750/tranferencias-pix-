<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIX</title>
<style>
body{
  background:#080808;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:20px
}
button{
  margin:5px;
  padding:15px 20px;
  border:0;
  border-radius:10px;
  background:#16a34a;
  color:white;
  font-weight:bold;
  font-size:16px;
  cursor:pointer
}
button:hover{background:#22c55e}
#resultado{margin-top:25px}
img{
  width:250px;
  background:white;
  padding:10px;
  border-radius:10px
}
textarea{
  width:95%;
  max-width:600px;
  height:100px;
  margin-top:15px;
  background:#111;
  color:white;
  padding:10px
}
</style>
</head>
<body>
<h1>💰 PAGAMENTO PIX</h1>
<p>Escolha o valor</p>
<div id="botoes"></div>
<div id="resultado"></div>
<script>
/* =========================
   DADOS DO PIX
========================= */
const chave =
"8217f3e7-bb4b-4fb4-adcd-c4df2d196de6";
const nome =
"CASH FARMEM";
const cidade =
"SAO PAULO";
const valores = [
250,300,500,600,700,800,900,1000,1500,2000,3000
];
/* =========================
   CAMPO TLV
========================= */
function campo(id, valor){
  return id +
    String(valor.length).padStart(2,"0") +
    valor;
}
/* =========================
   CRC16-CCITT
   POLINÔMIO 1021
   INICIAL FFFF
========================= */
function crc16(texto){
  let crc = 0xFFFF;
  for(let i=0;i<texto.length;i++){
    crc ^= texto.charCodeAt(i) << 8;
    for(let j=0;j<8;j++){
      if(crc & 0x8000){
        crc =
          ((crc << 1) ^ 0x1021) & 0xFFFF;
      }else{
        crc =
          (crc << 1) & 0xFFFF;
      }
    }
  }
  return crc
    .toString(16)
    .toUpperCase()
    .padStart(4,"0");
}
/* =========================
   GERAR PIX
========================= */
function gerarPix(valor){
  const contaPix =
    campo("00","br.gov.bcb.pix") +
    campo("01",chave);
  let pix =
    campo("00","01") +
    campo("26",contaPix) +
    campo("52","0000") +
    campo("53","986") +
    campo("54",valor.toFixed(2)) +
    campo("58","BR") +
    campo("59",nome) +
    campo("60",cidade) +
    campo(
      "62",
      campo("05","***")
    );
  /*
    6304 é incluído no cálculo
    do CRC conforme o BR Code.
  */
  pix += "6304";
  pix += crc16(pix);
  return pix;
}
/* =========================
   MOSTRAR PAGAMENTO
========================= */
function mostrar(valor){
  const pix = gerarPix(valor);
  document.getElementById("resultado").innerHTML = `
    <h2>
      R$ ${valor.toLocaleString(
        "pt-BR",
        {minimumFractionDigits:2}
      )}
    </h2>
    <img
      src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(pix)}"
      alt="QR Code PIX"
    >
    <br><br>
    <textarea id="codigo" readonly>${pix}</textarea>
<br>
<button onclick="copiar()">
  📋 COPIAR PIX
</button>

`;
}

/* =========================
COPIAR
========================= */

function copiar(){

const campo =
document.getElementById(“codigo”);

navigator.clipboard
.writeText(campo.value)
.then(() => {

  alert("✅ Pix Copia e Cola copiado!");
});

}

/* =========================
CRIAR OS 11 BOTÕES
========================= */

valores.forEach(valor => {

const botao =
document.createElement(“button”);

botao.textContent =
“R$ “ +
valor.toLocaleString(“pt-BR”);

botao.onclick =
() => mostrar(valor);

document
.getElementById(“botoes”)
.appendChild(botao);

});

</script>
</body>
</html>
